<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Cam</title>
    <style>
        body { text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 400px; border: 2px solid #333; border-radius: 8px; }
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Volleyball Camera</h2>
    <video id="video" autoplay playsinline></video>
    <div class="controls">
        <button onclick="startCamera()">เปิดกล้อง</button>
    </div>

    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                alert("ไม่สามารถเข้าถึงกล้องได้: " + err.message);
            }
        }
    </script>
</body>
</html>
